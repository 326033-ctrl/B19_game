<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <!-- スマホでの拡大縮小やスクロールを防止 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>くるるのおさんぽ</title>
    <!-- Tailwind CSSの読み込み -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 絵本風のかわいい丸ゴシックフォントを読み込み -->
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #FDF6E3; /* やさしいクリーム色 */
            color: #5D4037; /* あたたかい茶色 */
            font-family: 'M PLUS Rounded 1c', sans-serif;
            overflow: hidden;
            touch-action: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-image: radial-gradient(#FFF0C2 20%, transparent 20%), radial-gradient(#FFF0C2 20%, transparent 20%);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
        }

        #game-wrapper {
            position: relative;
            box-shadow: 0 10px 25px rgba(139, 90, 43, 0.15);
            border-radius: 16px;
            overflow: hidden;
            background-color: #F1F8E9; /* やわらかい若草色 */
            border: 4px solid #AED581;
        }

        canvas {
            display: block;
        }

        /* 絵本風のタイトル文字 */
        .storybook-title {
            color: #FF8A65;
            text-shadow: 2px 2px 0px #FFF, 4px 4px 0px rgba(0,0,0,0.1);
            font-weight: 900;
        }
        
        .storybook-text-red {
            color: #E53935;
        }

        /* UIオーバーレイ */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(253, 246, 227, 0.85);
            backdrop-filter: blur(2px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: opacity 0.3s ease;
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* カスタムボタン（ぷっくりかわいいボタン） */
        .btn {
            background: #FFB74D;
            color: #FFF;
            border: none;
            padding: 12px 32px;
            font-size: 1.5rem;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 6px 0 #F57C00, 0 10px 15px rgba(0,0,0,0.1);
            margin-top: 10px;
        }

        .btn:active {
            transform: translateY(6px);
            box-shadow: 0 0px 0 #F57C00, 0 5px 5px rgba(0,0,0,0.1);
        }

        /* モバイル用コントロール */
        .controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 12px;
            margin-top: 20px;
            width: 220px;
        }

        .control-btn {
            background: #FFF;
            border: 3px solid #AED581;
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #7CB342;
            font-size: 28px;
            font-weight: bold;
            height: 60px;
            box-shadow: 0 4px 0 #AED581;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            transition: all 0.1s;
        }

        .control-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0px 0 #AED581;
            background: #F1F8E9;
        }

        .up-btn { grid-column: 2; grid-row: 1; }
        .left-btn { grid-column: 1; grid-row: 2; }
        .down-btn { grid-column: 2; grid-row: 2; }
        .right-btn { grid-column: 3; grid-row: 2; }

        @media (min-width: 768px) {
            .controls {
                display: none; /* PCでは非表示 */
            }
        }
    </style>
</head>
<body>

    <!-- ヘッダー情報（スコア） -->
    <div class="w-full max-w-md flex justify-between items-end mb-4 px-4 font-bold">
        <div class="bg-white px-4 py-2 rounded-2xl shadow-sm border-2 border-orange-200">
            <p class="text-orange-400 text-xs tracking-wider">あつめた きの实</p>
            <p id="score-display" class="text-3xl text-orange-500 leading-none mt-1">0</p>
        </div>
        <div class="text-right bg-white px-4 py-2 rounded-2xl shadow-sm border-2 border-green-200">
            <p class="text-green-500 text-xs tracking-wider">いちばんの かず</p>
            <p id="highscore-display" class="text-2xl text-green-600 leading-none mt-1">0</p>
        </div>
    </div>

    <!-- ゲームエリア -->
    <div id="game-wrapper">
        <canvas id="gameCanvas"></canvas>
        
        <!-- スタート画面 -->
        <div id="start-screen" class="overlay">
            <h1 class="text-4xl mb-4 storybook-title text-center leading-tight">くるるの<br>おさんぽ</h1>
            <p class="text-amber-700 mb-6 text-sm font-bold bg-white/50 px-4 py-2 rounded-full">
                スワイプ か やじるし で うごかしてね
            </p>
            <button id="start-btn" class="btn">あそぶ！</button>
        </div>

        <!-- ゲームオーバー画面 -->
        <div id="gameover-screen" class="overlay hidden">
            <h2 class="text-4xl mb-2 storybook-title storybook-text-red text-center">ごっつんこ！</h2>
            <p class="text-amber-800 font-bold mb-1 mt-4">あつめた きの实</p>
            <p id="final-score" class="text-5xl font-bold text-orange-500 mb-6 drop-shadow-md">0</p>
            <button id="restart-btn" class="btn">もういっかい</button>
        </div>
    </div>

    <!-- モバイル用コントロールボタン -->
    <div class="controls" id="mobile-controls">
        <div class="control-btn up-btn" id="btn-up">▲</div>
        <div class="control-btn left-btn" id="btn-left">◀</div>
        <div class="control-btn down-btn" id="btn-down">▼</div>
        <div class="control-btn right-btn" id="btn-right">▶</div>
    </div>

    <script>
        /**
         * ゲームの設定と状態管理
         */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        const GRID_SIZE = 15; // マス目数(15x15) 少し大きめに設定して子供が見やすくする
        let tileSize = 0; 
        
        // UI要素
        const scoreDisplay = document.getElementById('score-display');
        const highScoreDisplay = document.getElementById('highscore-display');
        const finalScoreDisplay = document.getElementById('final-score');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('gameover-screen');
        
        // 状態変数
        let snake = [];
        let food = { x: 0, y: 0 };
        let particles = [];
        let direction = { x: 1, y: 0 };
        let nextDirection = { x: 1, y: 0 }; 
        let score = 0;
        let highScore = localStorage.getItem('kururuHighScore') || 0;
        let gameState = 'start'; 
        
        // ループ制御
        let lastRenderTime = 0;
        let snakeSpeed = 3.5; // 初期速度（子供向けにゆっくり）
        let animationId;

        // ハイスコアの初期表示
        highScoreDisplay.textContent = highScore;

        /**
         * 画面サイズに応じたキャンバスのリサイズ
         */
        function resizeCanvas() {
            const maxWidth = Math.min(window.innerWidth * 0.95, 450);
            const maxHeight = window.innerHeight * 0.55;
            const size = Math.min(maxWidth, maxHeight);
            
            tileSize = Math.floor(size / GRID_SIZE);
            canvas.width = tileSize * GRID_SIZE;
            canvas.height = tileSize * GRID_SIZE;
            
            if (gameState !== 'playing') {
                draw();
            }
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        /**
         * ゲームの初期化
         */
        function initGame() {
            // 初期は3マス
            snake = [
                { x: 5, y: 7 },
                { x: 4, y: 7 },
                { x: 3, y: 7 }
            ];
            direction = { x: 1, y: 0 };
            nextDirection = { x: 1, y: 0 };
            score = 0;
            snakeSpeed = 3.5; // ゆっくりスタート
            particles = [];
            scoreDisplay.textContent = score;
            placeFood();
            gameState = 'playing';
            
            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            
            lastRenderTime = performance.now();
            if (animationId) cancelAnimationFrame(animationId);
            animationId = requestAnimationFrame(gameLoop);
        }

        /**
         * 餌(赤い木の実)の配置
         */
        function placeFood() {
            let newFoodPosition;
            while (true) {
                newFoodPosition = {
                    x: Math.floor(Math.random() * GRID_SIZE),
                    y: Math.floor(Math.random() * GRID_SIZE)
                };
                const onSnake = snake.some(segment => segment.x === newFoodPosition.x && segment.y === newFoodPosition.y);
                if (!onSnake) {
                    break;
                }
            }
            food = newFoodPosition;
        }

        /**
         * メインゲームループ
         */
        function gameLoop(currentTime) {
            if (gameState !== 'playing') return;
            animationId = requestAnimationFrame(gameLoop);

            updateParticles();

            const secondsSinceLastRender = (currentTime - lastRenderTime) / 1000;
            if (secondsSinceLastRender < 1 / snakeSpeed) {
                draw();
                return;
            }
            
            lastRenderTime = currentTime;
            update();
            draw();
        }

        /**
         * ゲームロジックの更新
         */
        function update() {
            direction = nextDirection;
            
            const head = { 
                x: snake[0].x + direction.x, 
                y: snake[0].y + direction.y 
            };

            // 壁にぶつかったら
            if (head.x < 0 || head.x >= GRID_SIZE || head.y < 0 || head.y >= GRID_SIZE) {
                gameOver();
                return;
            }

            // 自分の体にぶつかったら
            if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
                gameOver();
                return;
            }

            snake.unshift(head); 

            // 木の実を食べた
            if (head.x === food.x && head.y === food.y) {
                score += 1; // 1個ずつ増える
                scoreDisplay.textContent = score;
                createParticles(food.x, food.y); 
                
                // 少しずつスピードアップ
                if (score % 3 === 0) {
                    snakeSpeed += 0.5;
                }
                
                placeFood();
            } else {
                snake.pop();
            }
        }

        /**
         * ゲームオーバー
         */
        function gameOver() {
            gameState = 'gameover';
            finalScoreDisplay.textContent = score;
            
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('kururuHighScore', highScore);
                highScoreDisplay.textContent = highScore;
            }
            
            gameOverScreen.classList.remove('hidden');
        }

        /**
         * 描画全般
         */
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawGrid();
            drawFood();
            drawSnake();
            drawParticles();
        }

        /**
         * やさしいチェック柄の背景
         */
        function drawGrid() {
            for (let x = 0; x < GRID_SIZE; x++) {
                for (let y = 0; y < GRID_SIZE; y++) {
                    if ((x + y) % 2 === 0) {
                        ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
                        ctx.fillRect(x * tileSize, y * tileSize, tileSize, tileSize);
                    }
                }
            }
        }

        /**
         * くるる（ヘビ）の描画
         */
        function drawSnake() {
            // 尻尾から頭へ向かって描画することで重なりをきれいに
            for (let i = snake.length - 1; i >= 0; i--) {
                const segment = snake[i];
                const cx = segment.x * tileSize + tileSize / 2;
                const cy = segment.y * tileSize + tileSize / 2;
                const radius = tileSize / 2.2;

                ctx.beginPath();
                ctx.arc(cx, cy, radius, 0, Math.PI * 2);
                
                if (i === 0) {
                    // 頭（ちょっと明るい黄緑色）
                    ctx.fillStyle = '#AED581';
                    ctx.fill();
                    
                    // お顔を描く
                    drawKururuFace(cx, cy, radius);
                } else {
                    // 体（シマシマ模様を少し入れるために色を変える）
                    if (i % 2 === 0) {
                        ctx.fillStyle = '#9CCC65';
                    } else {
                        ctx.fillStyle = '#8BC34A';
                    }
                    ctx.fill();
                }
            }
        }

        /**
         * くるるのお顔を描く
         */
        function drawKururuFace(cx, cy, radius) {
            // 進行方向に対する垂直ベクトルを計算（目を並べるため）
            let perpX = -direction.y;
            let perpY = direction.x;
            
            // 止まっている時（初期状態など）は右向きをデフォルトに
            if (direction.x === 0 && direction.y === 0) {
                perpX = 0; perpY = 1;
            }

            const eyeForwardOffset = radius * 0.3; // 進行方向へのズレ
            const eyeSideOffset = radius * 0.4;    // 横方向へのズレ

            // 右目と左目の位置
            const eye1X = cx + direction.x * eyeForwardOffset + perpX * eyeSideOffset;
            const eye1Y = cy + direction.y * eyeForwardOffset + perpY * eyeSideOffset;
            
            const eye2X = cx + direction.x * eyeForwardOffset - perpX * eyeSideOffset;
            const eye2Y = cy + direction.y * eyeForwardOffset - perpY * eyeSideOffset;

            // 白目
            ctx.fillStyle = '#FFFFFF';
            ctx.beginPath(); ctx.arc(eye1X, eye1Y, radius * 0.35, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(eye2X, eye2Y, radius * 0.35, 0, Math.PI*2); ctx.fill();

            // 黒目（少し進行方向へ寄せる）
            const pupilOffsetX = direction.x * radius * 0.1;
            const pupilOffsetY = direction.y * radius * 0.1;
            ctx.fillStyle = '#3E2723';
            ctx.beginPath(); ctx.arc(eye1X + pupilOffsetX, eye1Y + pupilOffsetY, radius * 0.15, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(eye2X + pupilOffsetX, eye2Y + pupilOffsetY, radius * 0.15, 0, Math.PI*2); ctx.fill();

            // ほっぺ（ピンク）
            const cheekForwardOffset = radius * 0.1;
            const cheekSideOffset = radius * 0.7;
            const cheek1X = cx + direction.x * cheekForwardOffset + perpX * cheekSideOffset;
            const cheek1Y = cy + direction.y * cheekForwardOffset + perpY * cheekSideOffset;
            const cheek2X = cx + direction.x * cheekForwardOffset - perpX * cheekSideOffset;
            const cheek2Y = cy + direction.y * cheekForwardOffset - perpY * cheekSideOffset;

            ctx.fillStyle = 'rgba(244, 143, 177, 0.7)';
            ctx.beginPath(); ctx.arc(cheek1X, cheek1Y, radius * 0.2, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(cheek2X, cheek2Y, radius * 0.2, 0, Math.PI*2); ctx.fill();
        }

        /**
         * 赤い木の実の描画
         */
        function drawFood() {
            const cx = food.x * tileSize + tileSize / 2;
            const cy = food.y * tileSize + tileSize / 2;
            const radius = tileSize / 2.5;

            // 実の部分
            ctx.beginPath();
            ctx.arc(cx, cy, radius, 0, Math.PI * 2);
            ctx.fillStyle = '#E53935';
            ctx.fill();

            // ツヤ（ハイライト）
            ctx.beginPath();
            ctx.arc(cx - radius * 0.3, cy - radius * 0.3, radius * 0.25, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
            ctx.fill();

            // 葉っぱ（上にちょこんと）
            ctx.beginPath();
            ctx.ellipse(cx, cy - radius, radius * 0.4, radius * 0.2, Math.PI / 4, 0, Math.PI * 2);
            ctx.fillStyle = '#4CAF50';
            ctx.fill();
        }

        /**
         * きらきらパーティクル生成
         */
        function createParticles(gridX, gridY) {
            const x = gridX * tileSize + tileSize / 2;
            const y = gridY * tileSize + tileSize / 2;
            const count = 10;
            const colors = ['#FFD54F', '#FF8A65', '#4FC3F7', '#FFF']; // カラフル
            
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 2 + 1;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: 1.0,
                    decay: Math.random() * 0.05 + 0.02,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    size: Math.random() * 4 + 2
                });
            }
        }

        /**
         * パーティクル更新
         */
        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= p.decay;
                
                if (p.life <= 0) {
                    particles.splice(i, 1);
                }
            }
        }

        /**
         * パーティクル描画
         */
        function drawParticles() {
            particles.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.fill();
            });
            ctx.globalAlpha = 1.0;
        }

        /**
         * 入力処理（キーボード）
         */
        window.addEventListener('keydown', e => {
            if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"].indexOf(e.code) > -1) {
                e.preventDefault();
            }
            if (gameState !== 'playing') return;

            switch (e.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    if (direction.y === 0) nextDirection = { x: 0, y: -1 };
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    if (direction.y === 0) nextDirection = { x: 0, y: 1 };
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    if (direction.x === 0) nextDirection = { x: -1, y: 0 };
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    if (direction.x === 0) nextDirection = { x: 1, y: 0 };
                    break;
            }
        });

        /**
         * 入力処理（ボタン）
         */
        const handleBtnInput = (dx, dy) => {
            if (gameState === 'playing') {
                if (dx !== 0 && direction.x === 0) nextDirection = { x: dx, y: 0 };
                if (dy !== 0 && direction.y === 0) nextDirection = { x: 0, y: dy };
            }
        };
        
        document.getElementById('btn-up').addEventListener('touchstart', (e) => { e.preventDefault(); handleBtnInput(0, -1); });
        document.getElementById('btn-down').addEventListener('touchstart', (e) => { e.preventDefault(); handleBtnInput(0, 1); });
        document.getElementById('btn-left').addEventListener('touchstart', (e) => { e.preventDefault(); handleBtnInput(-1, 0); });
        document.getElementById('btn-right').addEventListener('touchstart', (e) => { e.preventDefault(); handleBtnInput(1, 0); });
        
        document.getElementById('btn-up').addEventListener('mousedown', () => handleBtnInput(0, -1));
        document.getElementById('btn-down').addEventListener('mousedown', () => handleBtnInput(0, 1));
        document.getElementById('btn-left').addEventListener('mousedown', () => handleBtnInput(-1, 0));
        document.getElementById('btn-right').addEventListener('mousedown', () => handleBtnInput(1, 0));

        /**
         * 入力処理（スワイプ）
         */
        let touchStartX = 0;
        let touchStartY = 0;
        
        canvas.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }, {passive: false});

        canvas.addEventListener('touchmove', e => {
            e.preventDefault();
        }, {passive: false});

        canvas.addEventListener('touchend', e => {
            if (gameState !== 'playing') return;
            
            const touchEndX = e.changedTouches[0].screenX;
            const touchEndY = e.changedTouches[0].screenY;
            
            const dx = touchEndX - touchStartX;
            const dy = touchEndY - touchStartY;
            
            if (Math.abs(dx) < 30 && Math.abs(dy) < 30) return;
            
            if (Math.abs(dx) > Math.abs(dy)) {
                if (dx > 0 && direction.x === 0) nextDirection = { x: 1, y: 0 };
                else if (dx < 0 && direction.x === 0) nextDirection = { x: -1, y: 0 };
            } else {
                if (dy > 0 && direction.y === 0) nextDirection = { x: 0, y: 1 };
                else if (dy < 0 && direction.y === 0) nextDirection = { x: 0, y: -1 };
            }
        });

        // ボタンのイベント設定
        document.getElementById('start-btn').addEventListener('click', initGame);
        document.getElementById('restart-btn').addEventListener('click', initGame);

        // 初期描画
        draw();
    </script>
</body>
</html>
